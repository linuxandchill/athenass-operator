[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athenass-operator"
version = "0.1"
description = "Local web operator for selling GPU inference on AthenaSS (A77)."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1",
    "ngrok==1.7.0",
    "typer",
    "uvicorn>=0.34,<1",
]

[project.scripts]
athenass-operator = "ass_node.webapp:main"

[tool.setuptools.packages.find]
include = ["ass_node*"]

[tool.setuptools.package-data]
ass_node = ["web/*"]
